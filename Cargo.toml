[package]
repository = "https://github.com/enz1m/text"
name = "text-app"
version = "0.1.0"
authors = ["enzUI contributors"]
edition = "2024"
publish = false
license = "MIT"
description = "Edit plain text and source files"
rust-version = "1.95"

[workspace]
resolver = "3"

[features]
x11 = ["iced/x11", "enzui-widgets/x11"]
default = ["portal-dbus"]
center = ["dep:enzui-agent"]
portal-dbus = ["enzui-core/portal-dbus"]

[dependencies]
log = "0.4"
enzui-parent-lease = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-wayland = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-activity = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-clipboard = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
iced = { default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "wayland-dlopen", "wayland-decorations", "canvas", "svg", "a11y", "tokio"], git = "https://github.com/enz1m/enzim-iced.git", rev = "a6483d7eb2f98bd568dfd4a6d5ab0228ace287d6" }
iced_renderer = { default-features = false, git = "https://github.com/enz1m/enzim-iced.git", rev = "a6483d7eb2f98bd568dfd4a6d5ab0228ace287d6" }
enzui-core = { features = ["accesskit", "activation-native-iced", "application-dbus"], git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-services = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-icons = { git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
enzui-widgets = { features = ["portal-dbus", "application-dbus"], git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
regex = "1"
enzui-agent = { features = ["iced-consumer"], optional = true, git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
iced_test = { git = "https://github.com/enz1m/enzim-iced.git", rev = "a6483d7eb2f98bd568dfd4a6d5ab0228ace287d6" }

enzui-core = { features = ["security-fault-injection"], git = "https://github.com/enz1m/enzui.git", tag = "v0.2.0-alpha.1" }

[patch.crates-io]
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "40eeb41f8637ef1620afa377ba006874224b6d65" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
return_self_not_must_use = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
large_stack_arrays = "warn"
ref_option = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
significant_drop_in_scrutinee = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
unused_async = "warn"
string_slice = "warn"
unwrap_in_result = "warn"
panic = "warn"
iter_over_hash_type = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
format_push_string = "warn"
redundant_type_annotations = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
