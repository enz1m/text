<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Text</title>
  <defs>
    <filter id="enz-text-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- portrait keyline; front sheet 60 x 88 centred on (64 64); back sheets turn -12 / -5 deg about the centre -->
  <g filter="url(#enz-text-drop)">
    <rect x="34" y="20" width="60" height="88" rx="9" fill="#2F6FEA" transform="rotate(-12 64 64)"/>
    <rect x="34" y="20" width="60" height="88" rx="9" fill="#8DB2FA" transform="rotate(-5 64 64)"/>
    <rect x="34" y="20" width="60" height="88" rx="9" fill="#FFFFFF"/>
  </g>
  <rect x="40" y="45" width="46" height="18" rx="4" fill="#FFE07A"/>
  <rect x="44" y="32" width="24" height="6" rx="3" fill="#2B3140"/>
  <g fill="#5A4A12" fill-opacity="0.55">
    <rect x="44" y="48" width="36" height="4" rx="2"/>
    <rect x="44" y="56" width="28" height="4" rx="2"/>
  </g>
  <g fill="#B9C3D3">
    <rect x="44" y="72" width="40" height="4" rx="2"/>
    <rect x="44" y="80" width="34" height="4" rx="2"/>
    <rect x="44" y="88" width="40" height="4" rx="2"/>
    <rect x="44" y="96" width="20" height="4" rx="2"/>
  </g>
  <rect x="84" y="42" width="4" height="24" rx="2" fill="#2556D9"/>
</svg>
